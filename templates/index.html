<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Creater — 网站接入 MCP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Glassmorphism Design System for MCP Creater */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Color Palette */
      --glass-blue: #7dd3fc;
      --glass-purple: #c4b5fd;
      --glass-teal: #5eead4;
      --glass-green: #34d399;
      --glass-red: #f87171;
      --glass-cyan: #22d3ee;

      /* Background */
      --bg-base: #0f172a;
      --bg-deep: #0a0f1f;
      --bg-gradient-1: rgba(125, 211, 252, 0.08);
      --bg-gradient-2: rgba(196, 181, 253, 0.06);
      --bg-gradient-3: rgba(94, 234, 212, 0.04);

      /* Glass Cards */
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      --card-glow: 0 0 40px rgba(125, 211, 252, 0.15);

      /* Text Colors */
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-tertiary: #94a3b8;
      --text-accent: var(--glass-blue);

      /* Inputs */
      --input-bg: rgba(255, 255, 255, 0.05);
      --input-border: rgba(255, 255, 255, 0.1);
      --input-focus: 0 0 0 3px rgba(125, 211, 252, 0.3);

      /* Buttons */
      --btn-primary-bg: linear-gradient(135deg, var(--glass-blue), var(--glass-purple));
      --btn-primary-shadow: 0 6px 24px rgba(125, 211, 252, 0.4);
      --btn-secondary-bg: rgba(255, 255, 255, 0.05);
      --btn-secondary-border: rgba(255, 255, 255, 0.15);

      /* Status Colors */
      --status-success: var(--glass-green);
      --status-error: var(--glass-red);
      --status-info: #60a5fa;
      --status-warning: #fbbf24;

      /* Layout */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;

      /* Animations */
      --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    body {
      font-family: 'Manrope', 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--spacing-xl) var(--spacing-md);
      position: relative;
      overflow-x: hidden;

      /* Multi-layered gradient background */
      background-image:
        radial-gradient(circle at 20% 80%, var(--bg-gradient-1), transparent 40%),
        radial-gradient(circle at 80% 20%, var(--bg-gradient-2), transparent 40%),
        radial-gradient(circle at 40% 40%, var(--bg-gradient-3), transparent 40%),

        /* Subtle noise texture */
        url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
      
      background-attachment: fixed; /* Prevents background repainting on scroll */

      /* Animated gradient overlay */
      &::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          radial-gradient(circle at 0% 0%, rgba(125, 211, 252, 0.05), transparent 50%),
          radial-gradient(circle at 100% 0%, rgba(196, 181, 253, 0.05), transparent 50%),
          radial-gradient(circle at 50% 100%, rgba(94, 234, 212, 0.05), transparent 50%);
        z-index: -1;
        /* Removed expensive animation and overlay repaints to fix scroll lag */
        pointer-events: none;
      }
    }

    @keyframes gradientShift {
      0% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
      100% { opacity: 0.6; transform: scale(1); }
    }

    .container {
      width: 100%;
      max-width: 760px;
      animation: containerEnter 0.8s var(--transition-smooth) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes containerEnter {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: var(--spacing-xl);
      position: relative;
      animation: headerEnter 0.9s var(--transition-smooth) 0.2s forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    @keyframes headerEnter {
      to { opacity: 1; transform: translateY(0); }
    }

    .header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--glass-blue), var(--glass-purple), var(--glass-teal));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: var(--spacing-sm);
      letter-spacing: -0.5px;
      position: relative;
      display: inline-block;

      &::after {
        content: '⚡';
        position: absolute;
        right: -40px;
        top: 0;
        font-size: 2.2rem;
        animation: lightning 3s ease-in-out infinite;
      }
    }

    @keyframes lightning {
      0%, 90%, 100% { opacity: 0.4; transform: scale(1); }
      95% { opacity: 1; transform: scale(1.2); }
    }

    .header p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
      font-weight: 400;
    }

    /* Glass Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xl) var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
      /* Removed expensive backdrop-filter to fix scroll drops */
      /* background color increased slightly to compensate for lost blur */
      background: rgba(255, 255, 255, 0.09);
      box-shadow: var(--card-shadow);
      transition: all 0.4s var(--transition-smooth);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(30px);
      animation: cardEnter 0.6s var(--transition-smooth) forwards;

      &:nth-child(2) { animation-delay: 0.1s; }
      &:nth-child(3) { animation-delay: 0.2s; }

      &::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-blue), transparent);
        opacity: 0;
        transition: opacity 0.4s;
      }

      &:hover {
        transform: translateY(-4px);
        box-shadow: var(--card-shadow), var(--card-glow);
        border-color: rgba(125, 211, 252, 0.25);

        &::before {
          opacity: 1;
        }
      }
    }

    @keyframes cardEnter {
      to { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-family: 'Poppins', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--glass-blue);
      margin-bottom: var(--spacing-lg);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);

      &::before {
        content: '';
        width: 4px;
        height: 16px;
        background: linear-gradient(to bottom, var(--glass-blue), var(--glass-purple));
        border-radius: var(--radius-sm);
      }
    }

    /* Form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-md);
    }
    .form-group.full { grid-column: 1 / -1; }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-sm);
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.94rem;
      font-family: 'Manrope', sans-serif;
      outline: none;
      transition: all 0.3s var(--transition-smooth);

      &:hover {
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.07);
      }

      &:focus {
        border-color: var(--glass-blue);
        box-shadow: var(--input-focus);
        background: rgba(255, 255, 255, 0.08);
      }
    }

    select { cursor: pointer; }
    select option {
      background: var(--bg-deep);
      color: var(--text-primary);
      padding: var(--spacing-md);
    }

    .http-fields {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-md);
      margin-top: var(--spacing-lg);
      animation: slideDown 0.4s var(--transition-smooth);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .http-fields.show { display: grid; }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: var(--spacing-md);
      margin-top: var(--spacing-lg);
    }

    .btn {
      flex: 1;
      padding: 16px 0;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.96rem;
      font-weight: 600;
      font-family: 'Manrope', sans-serif;
      cursor: pointer;
      transition: all 0.3s var(--transition-smooth);
      position: relative;
      overflow: hidden;

      &::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        transition: left 0.7s;
      }

      &:hover::before {
        left: 100%;
      }

      &:active { transform: scale(0.98); }
      &:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
      }
    }

    .btn-start {
      background: var(--btn-primary-bg);
      color: white;
      box-shadow: var(--btn-primary-shadow);
      font-weight: 600;
      letter-spacing: 0.3px;

      &:hover:not(:disabled) {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 10px 32px rgba(125, 211, 252, 0.5);
      }
    }

    .btn-stop {
      background: var(--btn-secondary-bg);
      color: var(--glass-red);
      border: 1px solid rgba(248, 113, 113, 0.3);

      &:hover:not(:disabled) {
        background: rgba(248, 113, 113, 0.1);
        border-color: rgba(248, 113, 113, 0.5);
        transform: translateY(-2px);
      }
    }

    /* Status */
    .status-bar {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: var(--spacing-lg);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.03);
      margin-bottom: var(--spacing-md);
      font-size: 0.92rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s var(--transition-smooth);

      &:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.1);
      }
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--glass-red);
      flex-shrink: 0;
      transition: all 0.4s var(--transition-smooth);
      position: relative;

      &::before {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        border: 2px solid var(--glass-red);
        opacity: 0;
        animation: pulse 2s infinite;
      }
    }

    .dot.running {
      background: var(--glass-green);
      box-shadow: 0 0 16px rgba(52, 211, 153, 0.6);

      &::before {
        border-color: var(--glass-green);
        opacity: 0.4;
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.5); opacity: 0.1; }
    }

    .status-text {
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Connection hint */
    .conn-hint {
      display: none;
      padding: var(--spacing-lg);
      border-radius: var(--radius-md);
      background: rgba(125, 211, 252, 0.08);
      border: 1px solid rgba(125, 211, 252, 0.15);
      margin-bottom: var(--spacing-md);
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.6;
      animation: slideIn 0.4s var(--transition-smooth);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .conn-hint.show { display: block; }

    .conn-hint code {
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      color: var(--glass-blue);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.2s var(--transition-smooth);
      border: 1px solid transparent;

      &:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(125, 211, 252, 0.3);
        transform: translateY(-1px);
      }
    }

    /* Log */
    .log-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg);
      height: 240px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      line-height: 1.7;
      color: var(--text-tertiary);
      backdrop-filter: blur(10px);

      &::-webkit-scrollbar {
        width: 8px;
      }

      &::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.03);
        border-radius: var(--radius-sm);
      }

      &::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: var(--radius-sm);

        &:hover {
          background: rgba(255, 255, 255, 0.25);
        }
      }
    }

    .log-line {
      white-space: pre-wrap;
      word-break: break-all;
      padding: 2px 0;
      border-left: 3px solid transparent;
      padding-left: 12px;
      margin-bottom: 4px;
      transition: all 0.3s ease;
      animation: logEntry 0.5s var(--transition-smooth);

      &:hover {
        background: rgba(255, 255, 255, 0.03);
        border-left-color: rgba(125, 211, 252, 0.3);
      }
    }

    @keyframes logEntry {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .log-line.info {
      color: var(--glass-cyan);
      border-left-color: var(--glass-cyan);
    }

    .log-line.ok {
      color: var(--glass-green);
      border-left-color: var(--glass-green);
    }

    .log-line.err {
      color: var(--glass-red);
      border-left-color: var(--glass-red);
    }

    /* Copy toast */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(30px) scale(0.9);
      background: linear-gradient(135deg, var(--glass-blue), var(--glass-purple));
      color: white;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s var(--transition-bounce);
      z-index: 1000;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 40px rgba(125, 211, 252, 0.3);
      text-align: center;
      min-width: 200px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .container { padding: var(--spacing-sm); }

      .header h1 {
        font-size: 2.2rem;

        &::after {
          right: -32px;
          font-size: 1.8rem;
        }
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: var(--spacing-sm);
      }

      .card {
        padding: var(--spacing-lg) var(--spacing-md);
        border-radius: var(--radius-md);
      }

      .btn-row {
        flex-direction: column;
        gap: var(--spacing-sm);
      }

      .http-fields {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚡ MCP Creater</h1>
      <p>将个人网站快速接入 MCP，让 LLM 读取你的网站内容并提供个性化推荐</p>
    </div>

    <!-- 配置 -->
    <div class="card">
      <div class="card-title">网站配置</div>
      <div class="form-grid">
        <div class="form-group full">
          <label>网站 URL</label>
          <input id="site_url" type="url" placeholder="https://your-website.com">
        </div>
        <div class="form-group">
          <label>网站名称</label>
          <input id="site_name" placeholder="MySite">
        </div>
        <div class="form-group">
          <label>最大抓取页数</label>
          <input id="max_pages" type="number" value="20" min="1" max="100">
        </div>
      </div>
    </div>

    <!-- 传输模式 -->
    <div class="card">
      <div class="card-title">传输模式</div>
      <div class="form-grid">
        <div class="form-group full">
          <label>模式</label>
          <select id="transport" onchange="toggleHttp()">
            <option value="stdio">stdio — 本地子进程模式</option>
            <option value="streamable-http">Streamable HTTP — 远程 / 网络模式</option>
          </select>
        </div>
      </div>
      <div class="http-fields" id="httpFields">
        <div class="form-group">
          <label>监听地址</label>
          <input id="host" value="0.0.0.0">
        </div>
        <div class="form-group">
          <label>端口</label>
          <input id="port" type="number" value="8000" min="1024" max="65535">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-start" id="btnStart" onclick="startServer()">🚀 启动 Server</button>
        <button class="btn btn-stop" id="btnStop" onclick="stopServer()" disabled>■ 停止</button>
      </div>
    </div>

    <!-- 状态 & 日志 -->
    <div class="card">
      <div class="card-title">运行状态</div>
      <div class="status-bar">
        <div class="dot" id="dot"></div>
        <span class="status-text" id="statusText">未运行</span>
      </div>
      <div class="conn-hint" id="connHint"></div>
      <div class="log-box" id="logBox">
        <div class="log-line info">等待启动...</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">已复制到剪贴板 ✓</div>

  <script>
    let polling = null;

    function toggleHttp() {
      const mode = document.getElementById('transport').value;
      document.getElementById('httpFields').classList.toggle('show', mode === 'streamable-http');
    }

    async function startServer() {
      const body = {
        site_url: document.getElementById('site_url').value,
        site_name: document.getElementById('site_name').value || 'MySite',
        max_pages: document.getElementById('max_pages').value,
        transport: document.getElementById('transport').value,
        host: document.getElementById('host').value,
        port: document.getElementById('port').value,
      };
      const res = await fetch('/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!data.ok) { alert(data.msg); return; }
      startPolling();
    }

    async function stopServer() {
      await fetch('/stop', { method: 'POST' });
    }

    function startPolling() {
      if (polling) return;
      polling = setInterval(fetchStatus, 1500);
      fetchStatus();
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/status');
        const data = await res.json();
        updateUI(data);
      } catch (e) {}
    }

    function updateUI(data) {
      const dot = document.getElementById('dot');
      const statusText = document.getElementById('statusText');
      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');
      const logBox = document.getElementById('logBox');
      const connHint = document.getElementById('connHint');

      dot.classList.toggle('running', data.running);
      statusText.textContent = data.running ? '运行中' : '已停止';
      btnStart.disabled = data.running;
      btnStop.disabled = !data.running;

      // 连接提示
      if (data.running && data.config) {
        const cfg = data.config;
        let hint = '';
        if (cfg.transport === 'streamable-http') {
          const endpoint = `http://${cfg.host === '0.0.0.0' ? '127.0.0.1' : cfg.host}:${cfg.port}/mcp`;
          hint = `<strong>HTTP 端点：</strong><code onclick="copyText('${endpoint}')">${endpoint}</code><br>`
               + `<strong>Claude Code：</strong><code onclick="copyText('claude mcp add --transport http ${cfg.site_name} ${endpoint}')">claude mcp add --transport http ${cfg.site_name} ${endpoint}</code>`;
        } else {
          const cmd = `python server.py ${cfg.site_url} stdio`;
          hint = `<strong>stdio 模式</strong> — 由 MCP 客户端以子进程方式调用<br>`
               + `<strong>Claude Code：</strong><code onclick="copyText('claude mcp add ${cfg.site_name} -- python server.py ${cfg.site_url} stdio')">claude mcp add ${cfg.site_name} -- python server.py ${cfg.site_url} stdio</code>`;
        }
        connHint.innerHTML = hint;
        connHint.classList.add('show');
      } else {
        connHint.classList.remove('show');
      }

      // 日志
      if (data.logs && data.logs.length > 0) {
        logBox.innerHTML = data.logs.map(l => {
          let cls = '';
          if (l.includes('[UI]') || l.includes('[MCP]')) cls = 'info';
          else if (l.includes('完成') || l.includes('成功') || l.includes('启动')) cls = 'ok';
          else if (l.includes('错误') || l.includes('失败') || l.includes('Error')) cls = 'err';
          return `<div class="log-line ${cls}">${escHtml(l)}</div>`;
        }).join('');
        logBox.scrollTop = logBox.scrollHeight;
      }

      if (!data.running && polling) {
        clearInterval(polling);
        polling = null;
      }
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        const t = document.getElementById('toast');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 1800);
      });
    }

    // 页面加载后立即获取一次状态
    fetchStatus();
  </script>
</body>
</html>
